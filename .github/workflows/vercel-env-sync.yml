name: Sync Vercel Environment Variables

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-vercel-env:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VITE_STEAM_API_KEY: ${{ secrets.VITE_STEAM_API_KEY }}
      VITE_STEAM_VANITY_URL: ${{ secrets.VITE_STEAM_VANITY_URL }}
      VITE_STEAM_ID: ${{ secrets.VITE_STEAM_ID }}
    steps:
      - name: Validate required secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_PROJECT_ID VITE_STEAM_API_KEY VITE_STEAM_VANITY_URL VITE_STEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Sync environment variables to Vercel
        run: |
          set -euo pipefail

          # upsert=true ensures the variable is created if missing or updated if it already exists.
          query="upsert=true"
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            query="${query}&teamId=${VERCEL_TEAM_ID}"
          fi

          for key in VITE_STEAM_API_KEY VITE_STEAM_VANITY_URL VITE_STEAM_ID; do
            value="${!key}"
            payload="$(jq -cn \
              --arg key "$key" \
              --arg value "$value" \
              '{key: $key, value: $value, target: ["development", "preview", "production"], type: "encrypted"}'
            )"

            response="$(
              curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?${query}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$payload"
            )"

            if [ -z "$response" ]; then
              echo "::error::Empty response from Vercel API while syncing ${key}"
              exit 1
            fi

            echo "Synced ${key} to Vercel (development/preview/production)."
          done
