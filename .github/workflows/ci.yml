name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_STEAM_API_KEY: ${{ secrets.VITE_STEAM_API_KEY }}
      VITE_STEAM_VANITY_URL: ${{ secrets.VITE_STEAM_VANITY_URL }}
      VITE_STEAM_ID: ${{ secrets.VITE_STEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env for CI
        run: |
          cat <<EOF > .env
          VITE_STEAM_API_KEY=${VITE_STEAM_API_KEY}
          VITE_STEAM_VANITY_URL=${VITE_STEAM_VANITY_URL}
          VITE_STEAM_ID=${VITE_STEAM_ID}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
